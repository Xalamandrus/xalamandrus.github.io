<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projects Header</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#050805;
      --text: rgba(234,253,234,0.92);
      --muted: rgba(234,253,234,0.62);
      --kicker: rgba(234,253,234,0.45);
      --accent:#9bf00b;
      --stroke: rgba(255,255,255,0.08);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(900px 420px at 18% 0%, rgba(120,140,255,0.10), transparent 60%),
                  radial-gradient(900px 420px at 70% 0%, rgba(0,0,0,0.55), transparent 65%),
                  linear-gradient(#070a10, var(--bg));
      color: var(--text);
    }

    .projects-hero{
      padding: 44px 32px 34px;
      max-width: 980px;
    }

    .kicker{
      font-size: 0.80rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--kicker);
      margin-bottom: 10px;
    }

    .title{
      margin: 0 0 10px;
      font-size: clamp(2.2rem, 4.4vw, 3.2rem);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .desc{
      margin: 0;
      max-width: 74ch;
      font-size: 1.05rem;
      line-height: 1.55;
      color: var(--muted);
    }

    /* Link styled as a button (external nav) */
    .cta{
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px solid rgba(155,240,11,0.30);
      background: rgba(255,255,255,0.03);
      color: rgba(234,253,234,0.90);
      text-decoration: none;
      font-weight: 700;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
    }

    .cta:hover{
      transform: translateY(-1px);
      border-color: rgba(155,240,11,0.55);
      background: rgba(255,255,255,0.05);
    }

    .cta:focus-visible{
      outline: none;
      box-shadow: 0 0 0 4px rgba(155,240,11,0.18);
    }

    .divider{
      margin-top: 26px;
      height: 1px;
      background: var(--stroke);
      border: 0;
    }
  </style>
</head>

<body>
  <section class="projects-hero" aria-label="Nagłówek sekcji projekty">
    <div class="kicker">PROJECTS</div>
    <h1 class="title">Selected work</h1>

    <p class="desc">
      Poniżej znajdziesz moje wyróżnione oraz wszystkie projekty (gry, narzędzia, VR).
      Prace stricte artystyczne — modele 3D, grafika i real-time VFX — publikuję na ArtStation.
    </p>

    <a class="cta"
       href="https://www.artstation.com/YOUR_USERNAME"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="ArtStation — modele i VFX (otwiera się w nowej karcie)">
      ArtStation — modele i VFX
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M7 17L17 7M10 7h7v7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

    <hr class="divider" />
  </section>
</body>
</html>
