<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Xalamandrus | Tools Showcase (Top Carousel + Divider)</title>
<style>
:root{
  --bg:#0d1117;
  --text:#c9d1d9;
  --muted:#9aa3ad;
  --line:#5b6470;
  --blue:#58a6ff;
  --red:#ff4747;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}

/* === TOP CAROUSEL === */
section.carousel{
  padding:60px 0 36px;            /* mniejszy dół — zaraz będzie divider */
  overflow:hidden;
  position:relative;
}
.carousel-track{
  display:flex; align-items:center; gap:80px;
  will-change:transform; padding:0 80px;
}
.icon{
  width:88px;height:88px;flex:0 0 auto;cursor:pointer;
  transition:transform .25s ease,filter .25s ease,opacity .25s ease;
  filter:brightness(.75) invert(1); opacity:.9;
}
.icon:hover{transform:scale(1.18);filter:brightness(1)}
.icon.active{transform:scale(1.28);filter:brightness(1)}
section.carousel::before,section.carousel::after{
  content:"";position:absolute;top:0;bottom:0;width:160px;pointer-events:none;z-index:2
}
section.carousel::before{left:0;background:linear-gradient(to right,var(--bg) 30%,transparent)}
section.carousel::after{right:0;background:linear-gradient(to left,var(--bg) 30%,transparent)}

/* === SECTION DIVIDER (PRZEGRYWKA) === */
/* === SECTION DIVIDER (VERTICAL GRADIENT) === */
.divider {
  height: 3px;
  width: 100%;
  background: linear-gradient(
    90deg,
    var(--blue) 0%,
    var(--red) 25%,
    var(--blue) 50%,
    var(--red) 75%,
    var(--blue) 100%
  );
  background-size: 200% 100%;
  animation: dividerSlide 6s linear infinite;
  border-radius: 999px;
  margin: 0 0 36px;
}

@keyframes dividerSlide {
  0% { background-position: 0% 50%; }
  100% { background-position: 100% 50%; }
}


/* === MAIN SECTION === */
section.top{
  display:flex; justify-content:space-between; align-items:flex-start;
  gap:60px; flex-wrap:wrap; padding:24px 80px 100px;  /* mniej góry, bo jest divider */
  max-width:1400px; margin:0 auto;
}

/* === INFO === */
.info{flex:1 1 420px; max-width:560px}
.info h2{
  display:flex; align-items:center; gap:12px;
  font-size:2rem; color:#e6ebf1;
  position:relative; padding-bottom:10px; margin-bottom:18px
}
.info h2::after{
  content:""; position:absolute; left:0; bottom:0; width:100%; height:2px;
  background:linear-gradient(to right,var(--blue),transparent);
  opacity:.6; border-radius:999px;
}
.info h2 img{width:34px;height:34px;filter:brightness(.95) invert(1)}

.info .desc{
  position:relative; color:var(--muted); line-height:1.7; padding-left:20px;
  animation:fadeUp .6s ease-out forwards; opacity:0; animation-delay:.2s;
}
.info .desc::before{
  content:""; position:absolute; left:0; top:4px; bottom:-6px; width:3px;
  background:linear-gradient(to bottom,var(--blue),transparent);
  border-radius:999px;
}

/* === IMAGE STACK === */
.image-stack{position:relative;width:440px;height:300px;flex:1 1 440px}
.image-stack img{
  position:absolute;width:100%;height:100%;object-fit:cover;border-radius:16px;
  opacity:0; transform:translate(0,0) scale(.95);
  transition:transform .6s ease,opacity .6s ease
}
.image-stack img.active{opacity:1;transform:translate(0,0) scale(1);z-index:3}
.image-stack img.second{opacity:.85;transform:translate(16px,16px) scale(.97);z-index:2}
.image-stack img.third{opacity:.6;transform:translate(32px,32px) scale(.93);z-index:1}

/* === ANIMATIONS === */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fade-title{animation:fadeUp .45s ease-out forwards}
.fade-desc{animation:fadeUp .6s ease-out forwards; animation-delay:.15s; opacity:0}

/* === RWD === */
@media (max-width:900px){
  section.top{flex-direction:column;align-items:center;text-align:left;padding:24px 24px 80px}
  .image-stack{width:320px;height:220px}
  .carousel-track{gap:60px;padding:0 40px}
}
</style>
</head>
<body>

<!-- === TOP CAROUSEL === -->
<section class="carousel">
  <div class="carousel-track" id="track"></div>
</section>

<!-- === DIVIDER POMIĘDZY KARUZELĄ A TREŚCIĄ === -->
<div class="divider"></div>

<!-- === MAIN SECTION === -->
<section class="top">
  <div class="info" id="infoBox">
    <h2 class="fade-title"><img src="assets/icons/gitkraken.png" alt="">Wybierz narzędzie</h2>
    <div class="desc fade-desc">Kliknij ikonę z karuzeli powyżej, aby zobaczyć opis i trzy grafiki po prawej.</div>
  </div>

  <div class="image-stack" id="imageStack">
    <img src="assets/img/image.png" class="active">
    <img src="assets/img/obeer.png" class="second">
    <img src="assets/img/slay.png" class="third">
  </div>
</section>

<script>
const TOOLS=[
  {name:"Unity",img:"assets/icons/gitkraken.png",desc:"Shadery, VFX i gameplay (URP, Shader Graph, C#).",imgs:["assets/img/1.jpg","assets/img/2.jpg","assets/img/3.jpg"]},
  {name:"Unreal Engine 5",img:"assets/icons/gitkraken.png",desc:"Lumen, Niagara, realistyczne efekty i prototypy.",imgs:["assets/img/2.jpg","assets/img/3.jpg","assets/img/1.jpg"]},
  {name:"Blender",img:"assets/icons/gitkraken.png",desc:"Modelowanie, UV, bake, eksport do silników.",imgs:["assets/img/3.jpg","assets/img/1.jpg","assets/img/2.jpg"]},
  {name:"Krita",img:"assets/icons/gitkraken.png",desc:"Concept arty i ręcznie malowane tekstury.",imgs:["assets/img/1.jpg","assets/img/3.jpg","assets/img/2.jpg"]},
  {name:"FMOD",img:"assets/icons/gitkraken.png",desc:"Audio adaptacyjne i integracja w silniku.",imgs:["assets/img/3.jpg","assets/img/2.jpg","assets/img/1.jpg"]},
  {name:"GitHub",img:"assets/icons/gitkraken.png",desc:"Repozytoria, CI/CD, GitHub Pages.",imgs:["assets/img/2.jpg","assets/img/1.jpg","assets/img/3.jpg"]},
  {name:"Substance Painter",img:"assets/icons/gitkraken.png",desc:"Tekstury PBR (real/stylized).",imgs:["assets/img/1.jpg","assets/img/2.jpg","assets/img/3.jpg"]}
];

const track=document.getElementById("track");
const infoBox=document.getElementById("infoBox");
const stack=document.getElementById("imageStack");
let lastTool=null;

/* Build carousel + clone for seamless loop */
function addIcon(t){
  const i=document.createElement("img");
  i.className="icon"; i.src=t.img; i.alt=t.name;
  i.addEventListener("click",()=>selectTool(t,i));
  track.appendChild(i);
}
TOOLS.forEach(addIcon); TOOLS.forEach(addIcon);

/* Infinite scroll (bez pauzy) */
let pos=0, speed=0.6;
function animate(){
  pos-=speed;
  const first=track.children[0];
  const step=(first.offsetWidth||88)+80; // 80 = gap
  if(Math.abs(pos)>=step){ track.appendChild(first); pos+=step; }
  track.style.transform=`translateX(${pos}px)`;
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

/* Select tool (ignoruje ponowny klik tej samej) + animacje fadeUp */
function selectTool(tool,el){
  if(lastTool===tool.name) return;
  lastTool=tool.name;

  document.querySelectorAll(".icon").forEach(x=>x.classList.remove("active"));
  el.classList.add("active");

  infoBox.innerHTML=`
    <h2 class="fade-title"><img src="${tool.img}" alt="">${tool.name}</h2>
    <div class="desc fade-desc">${tool.desc}</div>`;

  const imgs=stack.querySelectorAll("img");
  imgs.forEach(i=>i.className="");
  imgs[0].src=tool.imgs[0];
  imgs[1].src=tool.imgs[1];
  imgs[2].src=tool.imgs[2];
  imgs[0].classList.add("active");
  imgs[1].classList.add("second");
  imgs[2].classList.add("third");
  stack.appendChild(imgs[0]);
}
</script>

</body>
</html>
