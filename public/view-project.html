<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/view-project.css" />

  <title>[Project Name] | Xalamandrus</title>
</head>
<body id="top" class="project-bg-active" style="--project-bg-image: url('assets/img/project-bg.png');">
  <div class="loading-screen" id="loadingScreen"></div>

  <div data-inject="components/navbar.html" data-target="#this"></div>

  <main class="project-main">

    <!-- HERO -->
    <header class="project-hero">
      <div class="project-hero-media" aria-hidden="true">
        <img src="" alt="[Project Name] header" decoding="async" />
      </div>
      <div class="project-hero-overlay" aria-hidden="true"></div>

      <div class="container project-hero-content reveal">
        <a class="project-back" href="projects.html">← Back to projects</a>

        <div class="project-kicker">[PROJECT TYPE]</div>
        <h1 class="project-title">[Project Name]</h1>
        <p class="project-subtitle">
          [Project description goes here. Brief overview of what this project is about.]
        </p>

        <div class="project-hero-actions">
          <div class="project-hero-action-buttons">
            <!-- Download button -->
            <a class="btn btn-primary" href="#" data-bind="download-build-btn" target="_blank" rel="noopener noreferrer" style="display:none;">
              <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              <span>Download Build</span>
            </a>
            <!-- Steam button -->
            <a class="btn btn-secondary" href="#" data-bind="steam-link-btn" target="_blank" rel="noopener noreferrer" style="display:none;">
              <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
              </svg>
              <span>View on Steam</span>
            </a>
          </div>
        </div>
      </div>
    </header>

    <!-- Keep the strip AFTER the hero (like on index) -->
    <div class="glass-strip" aria-hidden="true"></div>

    <!-- CONTENT -->
    <section class="vp-page reveal">

      <section class="vp-block reveal" id="overview">
        <div class="container">
          <h2 class="vp-heading text-heading" data-bind="heading-overview">Project Overview</h2>

          <p class="vp-text" data-bind="overview-text">
            <!-- dynamic overview -->
          </p>

          <dl class="vp-info" aria-label="Project details">
            <div class="vp-info-row">
              <dt>Programs &amp; Tools</dt>
              <dd>
                <div class="tags vp-tools" role="list" data-bind="tools-list">
                  <!-- dynamic tools -->
                </div>
              </dd>
            </div>
          </dl>
        </div>
      </section>

      <section class="vp-block reveal" id="role">
        <div class="container">
          <h2 class="vp-heading text-heading" data-bind="heading-role">My Role</h2>

          <p class="vp-text" data-bind="role-text">
            <!-- dynamic role -->
          </p>

          <dl class="vp-info" aria-label="Role details">
            <div class="vp-info-row">
              <dt>Responsibilities</dt>
              <dd>
                <div class="tags vp-tags" role="list" data-bind="tags-list">
                  <!-- dynamic tags -->
                </div>
              </dd>
            </div>
          </dl>
        </div>
      </section>

      <section class="vp-block reveal" id="gallery">
        <div class="container">
          <h2 class="vp-heading text-heading">Gallery</h2>

          <div class="vp-gallery" role="list" data-bind="gallery-list">
            <!-- dynamic gallery -->
          </div>

          <div class="vp-timeline-section" data-section="timeline" style="display: none;">
            <h3 class="vp-subheading">Timeline</h3>
            <div class="vp-timeline" role="list" data-bind="timeline-list">
              <!-- dynamic timeline -->
            </div>
          </div>
        </div>
      </section>

      <section class="vp-block reveal" id="code" data-section="code" style="display: none;">
        <div class="container">
          <h2 class="vp-heading text-heading">Code Examples</h2>

          <div class="code-tabs" role="tablist" data-bind="code-tabs"></div>

          <div class="code-panels" data-bind="code-panels">
            <!-- dynamic code panels -->
          </div>
        </div>
      </section>

    </section>

  </main>

  <div data-inject="components/footer.html" data-target="#this" class="fade-in-footer"></div>

  <script src="js/inject.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/code-tabs.js"></script>
  <script src="js/lightbox.js"></script>
  <script src="js/view-project.js"></script>
</body>
</html>
